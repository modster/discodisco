[project]
name = "discodisco-analysis"
version = "0.1.0"
description = "Disco ball controller — audio analysis process (FFT band levels + beat/BPM) publishing to NATS"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "PyAudioWPatch",
    "aubio-ledfx",
    "nats-py",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
